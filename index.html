<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        :root {
            --dark-pink: #d81b60;
            --soft-pink: #fce4ec;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--soft-pink);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .screen {
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; position: relative;
        }

        .hidden { display: none !important; }

        /* BUTTONS */
        button {
            background-color: var(--dark-pink);
            color: white; border: none;
            padding: 20px 50px; font-size: 24px;
            border-radius: 60px; cursor: pointer;
            font-weight: bold; z-index: 100;
            box-shadow: 0 8px 15px rgba(216, 27, 96, 0.3);
            transition: all 0.3s ease;
        }
        button:hover { transform: scale(1.1); background-color: #ad1457; }

        /* FIXED COUNTER */
        #daysAlive {
            position: fixed; top: 20px; width: 100%;
            font-size: 2.8rem; font-weight: 900;
            color: var(--dark-pink); text-shadow: 3px 3px white;
            z-index: 1000; text-align: center;
            pointer-events: none;
        }

        /* JUMPING LETTERS */
        .big-para {
            font-size: 3.8rem; font-weight: 900;
            color: var(--dark-pink);
            margin: 600px 0; /* Huge gap for auto-scroll */
            line-height: 1.3; padding: 0 10%;
            min-height: 40vh;
        }

        .letter {
            display: inline-block; opacity: 0;
            transform: translateY(30px);
            animation: jumpIn 0.5s forwards;
        }

        @keyframes jumpIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* MASSIVE CAKE */
        .cake-container {
            font-size: 350px; cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
        }

        .flame {
            font-size: 120px; margin-bottom: -70px;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }

        /* HUGE GIFTS */
        .gift-container {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 60px; padding: 50px;
        }

        .gift-box {
            width: 320px; height: 320px;
            background: var(--dark-pink);
            display: flex; align-items: center; justify-content: center;
            font-size: 120px; border-radius: 50px;
            cursor: pointer; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .gift-box:hover { transform: translateY(-10px); }

        /* EMOJI RAIN */
        .emoji {
            position: fixed; top: -50px; font-size: 35px;
            z-index: 500; animation: fall linear forwards;
            pointer-events: none;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* MODAL */
        .photo-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 5000;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="Saja_Boys_Ft_Andrew_Choi_neckwav_Danny_Chung_Kevin_Woo_SamUIL_KPop_Demon_Hunters_Cast_-_Soda_Pop_thinknews.com.ng.mp3" type="audio/mpeg">
    </audio>

    <section id="page1" class="screen">
        <h1 style="font-size: 5.5rem; color: var(--dark-pink); margin-bottom: 40px;">Happy Birthday!!</h1>
        <button onclick="initiateSequence()">Click Here</button>
    </section>

    <section id="page2" class="hidden">
        <div id="daysAlive"></div>
        
        <div id="para-section" class="screen" style="justify-content: flex-start; padding-top: 350px;">
            <div id="para1" class="big-para"></div>
            <div id="para2" class="big-para"></div>
            <div id="para3" class="big-para"></div>
            <div id="para4" class="big-para"></div>
        </div>

        <div id="cakeSection" class="hidden screen">
            <div class="cake-container" onclick="startBlowCountdown()">
                <div class="flame" id="flame">🔥</div>
                🎂
            </div>
            <h2 id="blowMsg" style="font-size: 3.5rem; color: var(--dark-pink); margin-top: -120px;">Click to Blow!</h2>
        </div>
    </section>

    <section id="page3" class="screen hidden">
        <h1 style="font-size: 4rem; margin-bottom: 60px; color: var(--dark-pink);">Open the Gifts</h1>
        <div class="gift-container">
            <div class="gift-box" onclick="openGift(1)">🎁</div>
            <div class="gift-box" onclick="openGift(2)">🎁</div>
            <div class="gift-box" onclick="openGift(3)">🎁</div>
            <div class="gift-box" onclick="openGift(4)">🎁</div>
        </div>
        <div style="height: 100vh;"></div> <h1 id="finalMsg" style="font-size: 5rem; color: var(--dark-pink); padding-bottom: 300px;">HAPPY BIRTHDAY! 🎊✨</h1>
    </section>

    <div id="photoModal" class="photo-overlay hidden">
        <img id="modalImg" src="" style="max-height: 70%; border-radius: 30px; border: 8px solid white; box-shadow: 0 0 50px rgba(255,255,255,0.2);">
        <h2 id="modalTxt" style="color: white; font-size: 2.5rem; margin: 30px;"></h2>
        <button onclick="closeGift()">Open Next</button>
    </div>

    <script>
        const birthDate = new Date("August 14, 2008 00:00:00");
        let giftsOpened = 0;

        const messages = [
            "From the very first breath you took on August 14, 2008, the world became a much brighter place...",
            "Every year since then, you have grown with so much grace, kindness, and a spirit that inspires us all.",
            "Watching you become the person you are today has been the greatest gift of all—you are truly one of a kind.",
            "So today, we celebrate every second, every minute, and every day of your beautiful life. Happy Birthday!"
        ];

        function initiateSequence() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
            const music = document.getElementById('bgMusic');
            music.play().catch(() => console.log("Audio requires interaction"));
            
            startEmojiRain();
            setInterval(updateDays, 1000);
            typeParagraph(0);
        }

        function updateDays() {
            const now = new Date();
            const diff = now - birthDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('daysAlive').innerText = `${days.toLocaleString()} Days Alive`;
        }

        function typeParagraph(index) {
            if (index >= messages.length) {
                setTimeout(() => {
                    document.getElementById('cakeSection').classList.remove('hidden');
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 2000);
                return;
            }

            const container = document.getElementById(`para${index + 1}`);
            const text = messages[index];
            
            // Auto-scroll to current para
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });

            text.split("").forEach((char, charIdx) => {
                const span = document.createElement("span");
                span.innerText = char === " " ? "\u00A0" : char;
                span.className = "letter";
                span.style.animationDelay = `${charIdx * 0.04}s`;
                container.appendChild(span);
            });

            setTimeout(() => {
                typeParagraph(index + 1);
            }, text.length * 40 + 3500); 
        }

        function startBlowCountdown() {
            let count = 3;
            const msg = document.getElementById('blowMsg');
            const timer = setInterval(() => {
                msg.innerText = `Blow in ${count}...`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    msg.innerText = "LET'S GO!!";
                    document.getElementById('flame').style.display = 'none';
                    setTimeout(() => {
                        document.getElementById('page2').classList.add('hidden');
                        document.getElementById('page3').classList.remove('hidden');
                        window.scrollTo(0, 0);
                    }, 1500);
                }
            }, 1000);
        }

        function startEmojiRain() {
            const emojis = ['💖', '🎂', '🎊', '🎉', '✨'];
            setInterval(() => {
                const e = document.createElement('div');
                e.className = 'emoji';
                e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                e.style.left = Math.random() * 100 + "vw";
                e.style.animationDuration = (Math.random() * 2 + 3) + "s";
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 5000);
            }, 400);
        }

        function openGift(id) {
            const data = {
                1: { img: 'Screenshot_2026-05-04-15-51-20-647.jpeg', txt: 'A Special Day!' },
                2: { img: 'Screenshot_2026-05-04-15-49-55-674.jpeg', txt: 'Wonderful Times' },
                3: { img: 'Screenshot_2026-05-04-15-34-31-232.jpeg', txt: 'Growing Together' },
                4: { img: 'Screenshot_2026-05-04-15-27-56-383.jpeg', txt: 'The Best is Yet to Come!' }
            };
            document.getElementById('modalImg').src = data[id].img;
            document.getElementById('modalTxt').innerText = data[id].txt;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        function closeGift() {
            document.getElementById('photoModal').classList.add('hidden');
            giftsOpened++;
            if (giftsOpened >= 4) {
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 800);
            }
        }
    </script>
</body>
</html>
